<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1025"/>
      <stop offset="1" stop-color="#2b0f1c"/>
    </linearGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.2" fill="#e11d48" fill-opacity="0.22"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotmask"><rect width="1280" height="320" fill="url(#fade)"/></mask>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <!-- halftone dots fading in from the right -->
  <rect width="1280" height="320" fill="url(#dots)" mask="url(#dotmask)"/>

  <!-- comic panels (right) -->
  <g transform="translate(900 44)" stroke="#fafafa" stroke-width="4" stroke-linejoin="round">
    <rect x="0"   y="0"   width="150" height="112" fill="#e11d48"/>
    <rect x="164" y="0"   width="150" height="112" fill="#f59e0b"/>
    <rect x="0"   y="126" width="314" height="106" fill="#1f1530"/>
    <!-- panel 1: speech bubble -->
    <path d="M26 30 h98 a14 14 0 0 1 14 14 v26 a14 14 0 0 1 -14 14 h-58 l-18 16 v-16 h-22 a14 14 0 0 1 -14 -14 v-26 a14 14 0 0 1 14 -14 z" fill="#fafafa" stroke="#1a1025" stroke-width="3"/>
    <!-- panel 2: star burst -->
    <path d="M239 22 l10 22 24 -6 -12 21 20 14 -24 5 3 24 -21 -12 -21 12 3 -24 -24 -5 20 -14 -12 -21 24 6 z" fill="#fafafa" stroke="#1a1025" stroke-width="3"/>
    <!-- panel 3: bar chart = rankings -->
    <g stroke="none">
      <rect x="40"  y="176" width="34" height="38" fill="#f59e0b"/>
      <rect x="92"  y="150" width="34" height="64" fill="#e11d48"/>
      <rect x="144" y="164" width="34" height="50" fill="#a78bfa"/>
    </g>
    <g stroke="none" fill="#fafafa" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="800">
      <text x="210" y="176" font-size="15">TOP 5</text>
      <text x="210" y="200" font-size="15">THIS WEEK</text>
    </g>
  </g>
  <text x="982" y="104" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="800" fill="#1a1025">NEW!</text>

  <!-- title -->
  <text x="80" y="128" font-family="Impact, Haettenschweiler, 'Arial Black', 'Segoe UI', sans-serif"
        font-size="84" font-weight="900" fill="#fafafa" letter-spacing="3">AKATSUKI</text>
  <rect x="84" y="146" width="120" height="7" fill="#e11d48"/>
  <text x="84" y="190" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="26" font-weight="600" fill="#fda4af">Comic Management System</text>
  <text x="84" y="226" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="16" fill="#d4d4d8" letter-spacing="1.5">READ · RATE · PREDICT · CREATE</text>
  <!-- language chips -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <rect x="84"  y="256" width="62"  height="28" rx="14" fill="#777BB4"/><text x="115" y="275" fill="#ffffff">PHP</text>
    <rect x="154" y="256" width="84"  height="28" rx="14" fill="#4479A1"/><text x="196" y="275" fill="#ffffff">MySQL</text>
    <rect x="246" y="256" width="112" height="28" rx="14" fill="#F7DF1E"/><text x="302" y="275" fill="#1a1025">JavaScript</text>
    <rect x="366" y="256" width="76"  height="28" rx="14" fill="#E34F26"/><text x="404" y="275" fill="#ffffff">HTML</text>
    <rect x="450" y="256" width="64"  height="28" rx="14" fill="#1572B6"/><text x="482" y="275" fill="#ffffff">CSS</text>
  </g>
</svg>
